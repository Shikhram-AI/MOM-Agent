    />

    <!-- Indicator Dot -->
    <circle cx="704" cy="365" r="28" fill="url(#miraGradient)" />

    <!-- Waveform Bars -->
    <rect x="372" y="446" width="30" height="96" rx="15" fill="url(#miraGradient)"/>
    <rect x="434" y="396" width="30" height="196" rx="15" fill="url(#miraGradient)"/>
    <circle cx="512" cy="494" r="16" fill="url(#miraGradient)"/>
